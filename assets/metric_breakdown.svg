<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="260" fill="#14131a"/>

  <text x="600" y="30" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e8e6e1" text-anchor="middle" letter-spacing="3">CONTRIBUTION TO AUTOMATION</text>
  <text x="600" y="50" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8a877e" text-anchor="middle" letter-spacing="1">automation quality attributable to intent analyst work</text>

  <!-- Baseline -->
  <line x1="60" y1="210" x2="500" y2="210" stroke="#3a3840" stroke-width="1"/>

  <!-- Bar 1: Yes automation -->
  <rect x="90" y="112.6" width="90" height="97.4" rx="4" fill="#1f1e26" stroke="#7a1f2b" stroke-width="1"/>
  <text x="135" y="104" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#c9a227" text-anchor="middle">74.9%</text>
  <text x="135" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e8e6e1" text-anchor="middle">Yes automation</text>
  <text x="135" y="242" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8a877e" text-anchor="middle">no errors</text>

  <!-- Bar 2: Automation errors -->
  <rect x="240" y="201.16" width="90" height="8.84" rx="4" fill="#1f1e26" stroke="#7a1f2b" stroke-width="1"/>
  <text x="285" y="197" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#c9a227" text-anchor="middle">6.8%</text>
  <text x="285" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e8e6e1" text-anchor="middle">Automation errors</text>
  <text x="285" y="242" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8a877e" text-anchor="middle">within automated dialogs</text>

  <!-- Bar 3: Full automation -->
  <rect x="390" y="103.8" width="90" height="106.2" rx="4" fill="#1f1e26" stroke="#7a1f2b" stroke-width="1"/>
  <text x="435" y="95" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#c9a227" text-anchor="middle">81.7%</text>
  <text x="435" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e8e6e1" text-anchor="middle">Full automation</text>
  <text x="435" y="242" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8a877e" text-anchor="middle">yes + errors, combined</text>

  <!-- Hero stat card: derived KPI -->
  <rect x="560" y="80" width="580" height="150" rx="10" fill="#1f1e26" stroke="#7a1f2b" stroke-width="1"/>
  <text x="850" y="108" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a877e" text-anchor="middle" letter-spacing="2">DERIVED KPI</text>
  <text x="850" y="165" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="600" fill="#c9a227" text-anchor="middle">91.7%</text>
  <text x="850" y="190" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#e8e6e1" text-anchor="middle">Contribution to automation</text>
  <text x="850" y="210" font-family="monospace" font-size="11" fill="#8a877e" text-anchor="middle">(yes_auto ÷ full_auto) × 100</text>
</svg>
